openapi: 3.0.3
info:
  title: Company & Reservation Service API
  version: v1
  description: >
    OpenAPI documentation for **Company** (companies, locations, service categories, services, business hours,
    notifications) and **Reservation** (reservations, payments, payment types, statuses) services.
servers:
  - url: http://localhost:8082
    description: Company Local
  - url: https://api.example.com
    description: Company Prod
  - url: http://localhost:8081
    description: Reservation Local
  - url: https://reservation.example.com
    description: Reservation Prod
tags:
  - name: Company
    description: Company management API
  - name: Location
    description: Location management API
  - name: Service Category
    description: Service Category management API
  - name: Service
    description: Service management API
  - name: Business Hours
    description: Business Hours management API
  - name: Notifications - SMS
    description: Proxy endpoints that send SMS via the sms-faas GraphQL on Vercel
  - name: SMS Notification Config
    description: SMS Notification Configuration API
  - name: Reservations
    description: Create and manage reservations
  - name: Payments
    description: Manage payments
  - name: Payment Types
    description: Manage payment types
  - name: Statuses
    description: Manage reservation statuses
  - name: Probe - Employees
    description: Lightweight passthroughs to Employee Service for debugging/integration checks
paths:
  ############################################################
  # Company domain
  ############################################################
  /api/companies:
    get:
      tags: [Company]
      summary: Get all companies
      description: Returns a list of all companies
      responses:
        "200":
          description: List of companies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Company"
    post:
      tags: [Company]
      summary: Create a new company
      description: Creates a new company with the provided information
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCompanyRequest"
      responses:
        "201":
          description: Company created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
        "400":
          description: Invalid input or referenced entities not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/companies/{id}:
    get:
      tags: [Company]
      summary: Get company by ID
      description: Returns a single company by its ID
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
          description: ID of the company to retrieve
      responses:
        "200":
          description: Company found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
        "404":
          description: Company not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags: [Company]
      summary: Update a company
      description: Updates an existing company by its ID
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
          description: ID of the company to update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCompanyRequest"
      responses:
        "200":
          description: Company updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
        "404":
          description: Company not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Invalid input or referenced entities not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [Company]
      summary: Delete a company
      description: Deletes a company by its ID
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
          description: ID of the company to delete
      responses:
        "204":
          description: Company deleted
        "404":
          description: Company not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/companies/{id}/upload-picture:
    post:
      tags: [Company]
      summary: Upload company picture
      description: Uploads a picture for a specific company
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
          description: ID of the company to upload picture for
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Picture uploaded
        "404":
          description: Company not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Upload failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/locations:
    get:
      tags: [Location]
      summary: Get all locations
      responses:
        "200":
          description: List of locations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Location"
    post:
      tags: [Location]
      summary: Create location
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLocationRequest"
      responses:
        "201":
          description: Location created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/locations/{id}:
    get:
      tags: [Location]
      summary: Get location by ID
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
          description: Location ID
      responses:
        "200":
          description: Location found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        "404":
          description: Location not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags: [Location]
      summary: Update location
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
          description: Location ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLocationRequest"
      responses:
        "200":
          description: Location updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        "404":
          description: Location not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [Location]
      summary: Delete location
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
          description: Location ID
      responses:
        "204":
          description: Location deleted
        "404":
          description: Location not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/service-categories:
    get:
      tags: [Service Category]
      summary: Get all service categories
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceCategory"
    post:
      tags: [Service Category]
      summary: Create service category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServiceCategoryRequest"
      responses:
        "201":
          description: Category created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceCategory"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Company not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/service-categories/{id}:
    get:
      tags: [Service Category]
      summary: Get service category by ID
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
          description: Category ID
      responses:
        "200":
          description: Category found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceCategory"
        "404":
          description: Category not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags: [Service Category]
      summary: Update service category
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
          description: Category ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateServiceCategoryRequest"
      responses:
        "200":
          description: Category updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceCategory"
        "404":
          description: Category not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [Service Category]
      summary: Delete category
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
          description: Category ID
      responses:
        "204":
          description: Category deleted
        "404":
          description: Category not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/service-categories/company/{id}:
    get:
      tags: [Service Category]
      summary: Get service categories by company UUID
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
          description: Company UUID
      responses:
        "200":
          description: Categories for company UUID
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceCategory"

  /api/services/company/{idCompany}:
    get:
      tags: [Service]
      summary: List services for a company
      parameters:
        - in: path
          name: idCompany
          required: true
          schema: { type: integer, format: int64 }
          description: Company ID
      responses:
        "200":
          description: List of services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceM"
  /api/services/company/{idCompany}/category/{idCategory}:
    get:
      tags: [Service]
      summary: List services for a company and category
      parameters:
        - in: path
          name: idCompany
          required: true
          schema: { type: integer, format: int64 }
        - in: path
          name: idCategory
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: List filtered by category
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceM"
  /api/services/{id}:
    get:
      tags: [Service]
      summary: Get service by ID
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
          description: Service ID
      responses:
        "200":
          description: Service found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceM"
        "404":
          description: Service not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags: [Service]
      summary: Update a service
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
          description: Service ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateServiceRequest"
      responses:
        "200":
          description: Service updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceM"
        "404":
          description: Service not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [Service]
      summary: Delete a service
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
          description: Service ID
      responses:
        "204":
          description: Service deleted
        "404":
          description: Service not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/services:
    post:
      tags: [Service]
      summary: Create a new service (JSON only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServiceRequest"
      responses:
        "201":
          description: Service created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceM"
        "400":
          description: Invalid input or referenced entities missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Referenced category or company not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/services/with-picture:
    post:
      tags: [Service]
      summary: Create a new service with picture (multipart/form-data)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                request:
                  description: JSON payload for service
                  type: string
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Service created with image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceM"
        "400":
          description: Invalid input or upload error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Referenced category or company not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/services/{id}/upload-picture:
    post:
      tags: [Service]
      summary: Upload service picture
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
          description: Service ID
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Picture uploaded
        "404":
          description: Service not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Upload failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/business-hours:
    get:
      tags: [Business Hours]
      summary: Get all business hours
      responses:
        "200":
          description: List of business hours
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BusinessHours"
    post:
      tags: [Business Hours]
      summary: Create new business hours
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBusinessHoursRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessHours"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Company not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/business-hours/company/{companyId}:
    get:
      tags: [Business Hours]
      summary: Get business hours by company ID
      parameters:
        - in: path
          name: companyId
          required: true
          schema: { type: integer, format: int64 }
          description: Company ID
      responses:
        "200":
          description: List for company
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BusinessHours"
        "404":
          description: Company not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/business-hours/{id}:
    get:
      tags: [Business Hours]
      summary: Get business hours by ID
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
          description: Business hours ID
      responses:
        "200":
          description: Entry found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessHours"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags: [Business Hours]
      summary: Update business hours
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
          description: Business hours ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBusinessHoursRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessHours"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [Business Hours]
      summary: Delete business hours
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
          description: Business hours ID
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/sms-notification-configs:
    get:
      tags: [SMS Notification Config]
      summary: Get all SMS notification configurations
      responses:
        "200":
          description: List of configs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SmsNotificationConfig"
    post:
      tags: [SMS Notification Config]
      summary: Create a new SMS notification configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSmsNotificationConfigRequest"
      responses:
        "201":
          description: Config created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SmsNotificationConfig"
  /api/sms-notification-configs/{id}:
    get:
      tags: [SMS Notification Config]
      summary: Get SMS notification configuration by ID
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
          description: Config ID
      responses:
        "200":
          description: Config found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SmsNotificationConfig"
        "404":
          description: Config not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags: [SMS Notification Config]
      summary: Update an SMS notification configuration
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
          description: Config ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSmsNotificationConfigRequest"
      responses:
        "200":
          description: Config updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SmsNotificationConfig"
        "404":
          description: Config not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [SMS Notification Config]
      summary: Delete an SMS notification configuration
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
          description: Config ID
      responses:
        "204":
          description: Config deleted
        "404":
          description: Config not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/notifications/sms/send:
    post:
      tags: [Notifications - SMS]
      summary: Send an SMS (via sms-faas GraphQL)
      description: >
        If 'templateId' is provided, 'variables' will be used to render the message. Otherwise, provide a 'message'.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendSmsRequest"
      responses:
        "200":
          description: SMS send attempt result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendSmsResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: sms-faas upstream error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  ############################################################
  # Reservation domain
  ############################################################
  /api/reservations/company/{idCompany}:
    get:
      tags: [Reservations]
      summary: List reservations for a company
      parameters:
        - in: path
          name: idCompany
          required: true
          schema: { type: integer, format: int64 }
          description: Company ID
      responses:
        "200":
          description: List of reservations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reservation"
  /api/reservations/user/{idUser}:
    get:
      tags: [Reservations]
      summary: List reservations for a user
      parameters:
        - in: path
          name: idUser
          required: true
          schema: { type: integer, format: int64 }
          description: User ID
      responses:
        "200":
          description: List of reservations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reservation"
  /api/reservations/{id}:
    get:
      tags: [Reservations]
      summary: Get reservation by ID
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
          description: Reservation ID
      responses:
        "200":
          description: Reservation found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "404":
          description: Reservation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [Reservations]
      summary: Delete (cancel) reservation
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "204":
          description: Reservation canceled
        "404":
          description: Reservation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/reservations:
    get:
      tags: [Reservations]
      summary: List reservations by employee (for Employee Service proxy)
      parameters:
        - in: query
          name: employee_id
          required: true
          schema: { type: integer, format: int64 }
          description: Employee ID
      responses:
        "200":
          description: List of reservations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reservation"
    post:
      tags: [Reservations]
      summary: Create a reservation
      description: >
        Creates a reservation. Required: date, idService, paymentId. Optional: idCompany, employeeId, customer details.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReservationCreateRequest"
      responses:
        "201":
          description: Reservation created
          headers:
            Location:
              description: URI of the created reservation
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "400":
          description: Invalid input or employee availability/skill failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Referenced entity not found (company/service/payment/user/status)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/reservations/free-slots/{idCompany}:
    get:
      tags: [Reservations]
      summary: Find free slots for a company / service
      description: Returns a list of available HH:mm - HH:mm slots on the given day.
      parameters:
        - in: path
          name: idCompany
          required: true
          schema: { type: integer, format: int64 }
          description: Company ID
        - in: query
          name: date
          required: true
          schema: { type: string, format: date-time }
          description: Date (start of search window)
        - in: query
          name: serviceId
          required: true
          schema: { type: integer, format: int64 }
          description: Service ID
        - in: query
          name: employeeId
          required: false
          schema: { type: integer, format: int64 }
          description: Employee ID (optional)
      responses:
        "200":
          description: List of free slots
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        "400":
          description: Invalid query parameters or date format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Service not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
