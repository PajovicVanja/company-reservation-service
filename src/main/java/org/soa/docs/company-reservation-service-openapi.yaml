components:
  schemas:
    ############################################################
    # Shared / Error
    ############################################################
    ErrorResponse:
      type: object
      properties:
        timestamp: { type: string, format: date-time, example: "2025-08-14T08:30:45.123+02:00" }
        status:    { type: integer, example: 404 }
        error:     { type: string, example: "Not Found" }
        message:   { type: string, example: "Entity not found" }
        path:      { type: string, example: "/api/resource/1" }

    ############################################################
    # Company domain models & DTOs
    ############################################################
    Company:
      type: object
      properties:
        id: { type: integer, format: int64 }
        description: { type: string }
        smsNotificationConfig:
          $ref: "#/components/schemas/SmsNotificationConfig"
        idPicture: { type: string, description: "Public image object key or path" }
        createdAt: { type: string, format: date-time }
        idAuthUser: { type: string }
        uuidUrl: { type: string }
        address: { type: string }
        phoneNumber: { type: string }
        email: { type: string, format: email }
        firstName: { type: string }
        lastName: { type: string }
        companyName: { type: string }
        location:
          $ref: "#/components/schemas/Location"
    CreateCompanyRequest:
      type: object
      required: [address, phoneNumber, email, companyName, locationId, smsNotificationConfigId]
      properties:
        description: { type: string, example: "Men haircuts" }
        idPicture: { type: string, example: "profilePicture_1.png" }
        idAuthUser: { type: string, example: "auth-123" }
        uuidUrl: { type: string, example: "abc-uuid" }
        address: { type: string, example: "Main street 1" }
        phoneNumber: { type: string, example: "+38640111222" }
        email: { type: string, format: email, example: "info@barber.si" }
        firstName: { type: string, example: "Nina" }
        lastName: { type: string, example: "Kos" }
        companyName: { type: string, example: "Barber Shop" }
        locationId: { type: integer, format: int64, example: 1 }
        smsNotificationConfigId: { type: integer, format: int64, example: 1 }
    UpdateCompanyRequest:
      type: object
      required: [locationId, smsNotificationConfigId]
      properties:
        description: { type: string, example: "Updated desc" }
        idPicture: { type: string, example: "profilePicture_1.png" }
        address: { type: string, example: "Main 2" }
        phoneNumber: { type: string, example: "+38640123456" }
        email: { type: string, format: email, example: "contact@barber.si" }
        firstName: { type: string, example: "Nina" }
        lastName: { type: string, example: "Kos" }
        companyName: { type: string, example: "Barber Shop" }
        locationId: { type: integer, format: int64, example: 1 }
        smsNotificationConfigId: { type: integer, format: int64, example: 1 }

    Location:
      type: object
      properties:
        id: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        street: { type: string }
        number: { type: string }
        parentLocation:
          $ref: "#/components/schemas/Location"
    CreateLocationRequest:
      type: object
      required: [name, number]
      properties:
        name: { type: string, example: "Trg Leona" }
        number: { type: string, example: "3" }
        parentLocationId: { type: integer, format: int64, example: 1 }
    UpdateLocationRequest:
      type: object
      required: [name, number]
      properties:
        name: { type: string, example: "Nova ulica" }
        number: { type: string, example: "12" }
        parentLocationId: { type: integer, format: int64, example: 1 }

    ServiceCategory:
      type: object
      properties:
        id: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        name: { type: string }
        company:
          $ref: "#/components/schemas/Company"
    CreateServiceCategoryRequest:
      type: object
      required: [name, companyId]
      properties:
        name: { type: string, example: "Hair" }
        companyId: { type: integer, format: int64, example: 1 }
    UpdateServiceCategoryRequest:
      type: object
      required: [name, companyId]
      properties:
        name: { type: string, example: "Massage" }
        companyId: { type: integer, format: int64, example: 1 }

    ServiceM:
      type: object
      properties:
        id: { type: integer, format: int64 }
        category:
          $ref: "#/components/schemas/ServiceCategory"
        createdAt: { type: string, format: date-time }
        company:
          $ref: "#/components/schemas/Company"
        name: { type: string }
        description: { type: string }
        price: { type: number, format: float }
        idPicture: { type: string }
        duration: { type: integer, format: int32, description: "Duration in minutes" }
    CreateServiceRequest:
      type: object
      required: [categoryId, companyId, name, price, duration]
      properties:
        categoryId: { type: integer, format: int64, example: 2 }
        companyId: { type: integer, format: int64, example: 1 }
        name: { type: string, example: "Massage" }
        description: { type: string, example: "Relax" }
        price: { type: number, format: float, example: 50.0 }
        idPicture: { type: string, example: "service_picture.png" }
        duration: { type: integer, format: int32, example: 60 }
    UpdateServiceRequest:
      type: object
      required: [categoryId, companyId, name, price, duration]
      properties:
        categoryId: { type: integer, format: int64, example: 2 }
        companyId: { type: integer, format: int64, example: 1 }
        name: { type: string, example: "Massage Deluxe" }
        description: { type: string, example: "Relax++" }
        price: { type: number, format: float, example: 65.0 }
        idPicture: { type: string, example: "service_picture.png" }
        duration: { type: integer, format: int32, example: 75 }

    BusinessHours:
      type: object
      properties:
        id: { type: integer, format: int64 }
        dayNumber: { type: integer, format: int32 }
        createdAt: { type: string, format: date-time }
        timeFrom: { type: string, format: time }
        timeTo: { type: string, format: time }
        pauseFrom: { type: string, format: time, nullable: true }
        pauseTo: { type: string, format: time, nullable: true }
        company:
          $ref: "#/components/schemas/Company"
        day: { type: string }
    CreateBusinessHoursRequest:
      type: object
      required: [dayNumber, timeFrom, timeTo, companyId, day]
      properties:
        dayNumber: { type: integer, example: 1 }
        timeFrom: { type: string, format: time, example: "09:00:00" }
        timeTo: { type: string, format: time, example: "17:00:00" }
        pauseFrom: { type: string, format: time, example: "12:00:00" }
        pauseTo: { type: string, format: time, example: "12:30:00" }
        companyId: { type: integer, format: int64, example: 1 }
        day: { type: string, example: "MONDAY" }
    UpdateBusinessHoursRequest:
      type: object
      required: [dayNumber, timeFrom, timeTo, companyId, day]
      properties:
        dayNumber: { type: integer, example: 2 }
        timeFrom: { type: string, format: time, example: "10:00:00" }
        timeTo: { type: string, format: time, example: "18:00:00" }
        pauseFrom: { type: string, format: time, example: "12:30:00" }
        pauseTo: { type: string, format: time, example: "13:00:00" }
        companyId: { type: integer, format: int64, example: 1 }
        day: { type: string, example: "TUESDAY" }

    SmsNotificationConfig:
      type: object
      properties:
        id: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        name: { type: string }
        notificationMessage: { type: string }
    CreateSmsNotificationConfigRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, example: "Default" }
        notificationMessage: { type: string, example: "Reminder: your appointment is tomorrow." }
    UpdateSmsNotificationConfigRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, example: "Default" }
        notificationMessage: { type: string, example: "Reminder: your appointment is tomorrow." }

    SendSmsRequest:
      type: object
      required: [phone]
      properties:
        phone: { type: string, example: "+38640111222" }
        templateId: { type: string, description: "Template ID to render (optional if 'message' is provided)" }
        message: { type: string, description: "Raw message text (optional if 'templateId' is provided)" }
        variables:
          type: object
          additionalProperties:
            type: string
          description: "Template variables: used when templateId is provided."
    SendSmsResponse:
      type: object
      properties:
        ok: { type: boolean, example: true }
        status: { type: string, example: "SENT" }
        id: { type: string, example: "689f7b068dca95494412ae19" }
        phone: { type: string, example: "+38640111222" }
        message: { type: string, example: "Hi Ana, your appointment is at 10:30." }
        createdAt: { type: string, example: "2025-08-15T18:23:02.376Z" }

    ############################################################
    # Reservation domain models & DTOs
    ############################################################
    Reservation:
      type: object
      properties:
        id: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        date: { type: string, format: date-time }
        dateTo: { type: string, format: date-time }
        company:
          $ref: "#/components/schemas/Company"
        service:
          $ref: "#/components/schemas/ServiceM"
        idCustomer: { type: integer, format: int32 }
        employeeId: { type: integer, format: int64, description: "Plain employee id (no FK)" }
        sendSms: { type: string, format: date-time }
        twoFACode: { type: integer, format: int64 }
        hidden: { type: boolean }
        customerEmail: { type: string, format: email }
        customerPhoneNumber: { type: integer, format: int64 }
        customerFullName: { type: string }
        status:
          $ref: "#/components/schemas/Status"
        payment:
          $ref: "#/components/schemas/Payment"
        notified: { type: boolean }
    ReservationCreateRequest:
      type: object
      required: [date, idService, paymentId]
      properties:
        date: { type: string, format: date-time, example: "2025-02-01T10:00:00.000+00:00" }
        idCompany: { type: integer, format: int64, example: 42, description: "FK to Company" }
        idService: { type: integer, format: int64, example: 7, description: "FK to Service" }
        idCustomer: { type: integer, example: 123 }
        sendSms: { type: string, format: date-time, example: "2025-02-01T09:00:00.000+00:00" }
        twoFACode: { type: integer, format: int64, example: 123456 }
        hidden: { type: boolean, example: false }
        customerEmail: { type: string, format: email, example: "john@example.com" }
        customerPhoneNumber: { type: integer, format: int64, example: 38640111222 }
        customerFullName: { type: string, example: "John Doe" }
        statusId: { type: integer, format: int64, example: 1, description: "FK to Status" }
        paymentId: { type: integer, format: int64, example: 5, description: "FK to Payment" }
        employeeId: { type: integer, format: int64, example: 321, description: "Plain employee id (no FK)" }
    ReservationStatusUpdateRequest:
      type: object
      required: [statusId]
      properties:
        statusId: { type: integer, format: int64, example: 2 }
    AdminReservationUpdateRequest:
      type: object
      required: [statusId]
      properties:
        statusId: { type: integer, format: int64, example: 3 }

    Payment:
      type: object
      properties:
        id: { type: integer, format: int64 }
        paymentTypes:
          $ref: "#/components/schemas/PaymentTypes"
        status: { type: string }
        datePaid: { type: string, format: date-time }
        amount: { type: number, format: double }
    PaymentCreateRequest:
      type: object
      properties:
        paymentTypeId: { type: integer, format: int64, description: "FK to Payment Type", example: 1 }
        status: { type: string, example: "PAID" }
        datePaid: { type: string, format: date-time, example: "2025-01-31T09:15:00.000+00:00" }
        amount: { type: number, format: double, example: 49.99 }
    PaymentUpdateRequest:
      type: object
      properties:
        paymentTypeId: { type: integer, format: int64, description: "FK to Payment Type", example: 1 }
        status: { type: string, example: "REFUNDED" }
        datePaid: { type: string, format: date-time, example: "2025-02-01T12:00:00.000+00:00" }
        amount: { type: number, format: double, example: 49.99 }

    PaymentTypes:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        durationFrom: { type: string, format: date-time, nullable: true }
        durationTo: { type: string, format: date-time, nullable: true }
        addedBy: { type: integer, format: int64, nullable: true }
        deletedBy: { type: integer, format: int64, nullable: true }
    PaymentTypesCreateRequest:
      type: object
